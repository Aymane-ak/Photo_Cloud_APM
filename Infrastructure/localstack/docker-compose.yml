version: "3.8"

services:
  localstack:
    container_name: localstack
    image: localstack/localstack:latest
    ports:
      - "4566:4566"          # endpoint unique pour tous les services
      - "4571:4571"
    environment:
      - SERVICES=s3,lambda,dynamodb,sqs,apigateway,iam,sts,cloudwatch,logs
      - DEBUG=1
      - LAMBDA_EXECUTOR=docker
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./data:/var/lib/localstack"
